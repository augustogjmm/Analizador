name: Temporary lockfile regeneration (test branch only)
on:
  push:
    branches:
      - maintenance/verify-react-vinext-20261118
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'augustogjmm/Analizador' && github.ref == 'refs/heads/maintenance/verify-react-vinext-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve dependency graph without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile on the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches manifest'
          else
            git commit -m 'test(deps): regenerate locked dependency graph for compatibility review'
            git push origin HEAD:refs/heads/maintenance/verify-react-vinext-20261118
          fi
      # Remove this temporary workflow before opening/merging an integration PR.
