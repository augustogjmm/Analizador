name: Liquidity Lab quality checks
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/quality.yml'
permissions:
  contents: read
jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit --pretty false
      # Unit tests and live deployment validation are separate responsibilities.
