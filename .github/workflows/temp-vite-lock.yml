name: Temporary Vite lockfile sync (test branch only)
on:
  push:
    branches:
      - maintenance/verify-vite-838-20261118
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'augustogjmm/Analizador' && github.ref == 'refs/heads/maintenance/verify-vite-838-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Lock dependency graph without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save lockfile on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(deps): refresh Vite 8.3.8 lockfile for isolated review'
            git push origin HEAD:refs/heads/maintenance/verify-vite-838-20261118
          fi
      # Remove this file from the branch before opening an integration PR.
